        .name {

            font-size: 22px;
            font-weight: 700;
            line-height: 1;
            display: block;
            white-space: nowrap;

        .contact-icon {
            width: 15px;
            height: auto;

            margin-right: 5px;
            display: inline-block;

        /* right box */
        .right-box {
            border: 2px solid #b7b7b7;
            border-radius: 10px;
            text-align: center;
            padding: 10px 4px;
            box-sizing: border-box;

                max-width: 18px;
